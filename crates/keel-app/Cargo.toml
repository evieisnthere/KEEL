[package]
name = "keel-app"
description = "KEEL desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
keel-io = { path = "../keel-io" }
keel-model = { path = "../keel-model" }
keel-geom = { path = "../keel-geom" }
keel-layout = { path = "../keel-layout" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "__screenshot"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
